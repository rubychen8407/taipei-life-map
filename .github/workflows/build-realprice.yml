name: Build real price data
# 實價登錄每月 1、11、21 日發布；隔天產生 data/realprice.json、data/valuation.json（回測沒過就不更新）
on:
  schedule:
    - cron: '41 19 1,11,21 * *'   # 每月 2、12、22 日 03:41（台北時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-realprice
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_realprice.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realprice.json data/valuation.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update real price data $(date -u +%F)"
          git pull --rebase origin master
          git push

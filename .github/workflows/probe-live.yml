name: probe-live
on: {push: {branches: ['fix/probe-live']}}
permissions: {contents: write}
jobs:
  p:
    if: "!contains(github.event.head_commit.message, '[out]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: python3 tests/demo_capture.py
      - run: python3 tests/demo_cut.py && rm -rf demo/fr demo/*.txt && ls -la demo
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add demo && git commit -m "demo output [out]" && git push

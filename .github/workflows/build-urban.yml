name: Build urban renewal data
# 每月用臺北市都市發展局 ArcGIS 圖層「都市更新地區範圍」產生 data/urban.json；
# 再用都市更新研究發展基金會的「臺北市都市更新地圖」（Google 我的地圖 KML）產生 data/urcase.json（都更案件）
on:
  schedule:
    - cron: '23 20 6 * *'   # 每月 7 日 04:23（台北時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-urban
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_urban.py
        id: urban
        continue-on-error: true
      - run: python3 scripts/build_urcase.py
        id: urcase
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/urban.json data/urcase.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update urban renewal data $(date -u +%F)"
          git pull --rebase origin master
          git push
      - name: Fail if a build failed
        if: steps.urban.outcome == 'failure' || steps.urcase.outcome == 'failure'
        run: exit 1

name: Build urban renewal data
# 每月用臺北市都市發展局 ArcGIS 圖層「都市更新地區範圍」產生 data/urban.json
on:
  schedule:
    - cron: '23 20 6 * *'   # 每月 7 日 04:23（台北時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-urban
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_urban.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/urban.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update urban renewal data $(date -u +%F)"
          git pull --rebase origin master
          git push

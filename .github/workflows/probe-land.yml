name: probe land
on: { push: { branches: ['probe/land'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python3 scripts/build_land.py
          gzip -9 -c data/land.json | wc -c
          python3 -c "
          import json;d=json.load(open('data/land.json'));S=d['sections'];print(d['year'],d['base_year'],d['lo'],d['hi'],d['stats'])
          S.sort(key=lambda s:s['v']);P=3.305785
          for s in S[:3]+S[len(S)//2:len(S)//2+3]+S[-5:]: print(s['d'],s['n'],s['b'],s['k'],round(s['v']*P/1e4,1),'萬/坪',s['g'])
          import collections;print(collections.Counter(s['d'] for s in S if s['b']=='pub'))"

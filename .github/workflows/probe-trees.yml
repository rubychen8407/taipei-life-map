name: probe trees
on: { push: { branches: ['probe/trees'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python3 scripts/build_trees.py
          ls -l data/trees.json; gzip -9 -c data/trees.json | wc -c
          python3 -c "
          import json;d=json.load(open('data/trees.json'));print(d['n'],len(d['sp']),len(d['rd']),d['base'],d['stats']);print(d['sp'][:15])
          a=d['a'];import collections
          print('maxd',max(a[0::6]),max(a[1::6]),'h',max(a[4::6]),'dia',max(a[5::6]))
          b=d['base'];c=collections.Counter((round(b[0]+a[i]/1e5,2),round(b[1]+a[i+1]/1e5,2)) for i in range(0,len(a),6));print('densest 0.01 cells',c.most_common(3))"

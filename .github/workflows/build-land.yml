name: Build land value data
# 每月用臺北市地段圖＋公告土地現值（地政局）產生 data/land.json（土地價值圖層）
on:
  schedule:
    - cron: '53 19 5 * *'   # 每月 6 日 03:53（台北時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-land
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_land.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/land.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update land value data $(date -u +%F)"
          git pull --rebase origin master
          git push

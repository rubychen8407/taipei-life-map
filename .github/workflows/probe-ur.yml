name: probe-ur
on:
  push:
    branches: ['fix/ur-probe']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://www.historygis.udd.gov.taipei/arcgis/rest/services/UrbanPlan2/PlanTheme/MapServer
          curl -sS -m 60 "$S?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print([(l['id'],l['name']) for l in d['layers']])"
          curl -sS -m 60 "$S/0?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('fields',[(f['name'],f.get('alias')) for f in d.get('fields',[])]);print('maxRecord',d.get('maxRecordCount'),'geom',d.get('geometryType'),'desc',(d.get('description') or '')[:300])"
          curl -sS -m 60 "$S/0/query?where=1%3D1&returnCountOnly=true&f=json"; echo
          curl -sS -m 120 "$S/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson" -o ur.geojson; ls -la ur.geojson
          python3 - <<'PY'
          import json,collections
          d=json.load(open('ur.geojson')); fs=d.get('features',[]); print('features',len(fs), d.get('exceededTransferLimit'))
          for f in fs[:6]: print(json.dumps(f['properties'],ensure_ascii=False)[:400])
          for k in (fs[0]['properties'] if fs else {}):
            c=collections.Counter(str(f['properties'].get(k))[:30] for f in fs)
            if len(c)<40: print(k, c.most_common(12))
          PY

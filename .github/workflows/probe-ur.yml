name: probe-ur
on:
  push:
    branches: ['fix/ur-probe']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.historygis.udd.gov.taipei/arcgis/rest/services
          curl -sS -m 40 "$B?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('folders',d.get('folders'));print('services',[s['name']+':'+s['type'] for s in d.get('services',[])])"
          for f in $(curl -sS -m 40 "$B?f=json" | python3 -c "import sys,json;print(' '.join(json.load(sys.stdin).get('folders',[])))"); do
            for s in $(curl -sS -m 40 "$B/$f?f=json" | python3 -c "import sys,json;print(' '.join(x['name']+'/'+x['type'] for x in json.load(sys.stdin).get('services',[])))"); do
              curl -sS -m 40 "$B/$s?f=json" | python3 -c "
          import sys,json
          try: d=json.load(sys.stdin)
          except Exception: sys.exit()
          for l in d.get('layers',[]):
            n=l['name']
            if any(k in n for k in ['更新','都更','危老','重建']): print('$s', l['id'], n)
          " || true
            done
          done

name: probe market
on: { push: { branches: ['probe/market'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > show.py <<'PY'
          raw=open('f','rb').read()
          t=None
          for enc in ('utf-8-sig','cp950'):
              try: t=raw.decode(enc); break
              except Exception: pass
          t=t or raw.decode('cp950','replace')
          L=t.splitlines(); print('lines',len(L),'bytes',len(raw))
          print('\n'.join(x[:400] for x in L[:4])); print('...'); print('\n'.join(x[:400] for x in L[-3:]))
          PY
          show(){ echo; echo "=== $1"; curl -sSL -m 120 "$2" -o f || echo FAIL; python3 show.py || true; }
          show bldg_reg_m "https://tsis.dbas.gov.taipei/statis/webMain.aspx?sys=220&ymf=10001&kind=21&type=0&funid=a05001701&cycle=1&outmode=12&compmode=0&outkind=1&deflst=2&nzo=1"
          show bldg_reg_y "https://tsis.dbas.gov.taipei/statis/webMain.aspx?sys=220&ymf=5700&kind=21&type=0&funid=a05001701&cycle=4&outmode=12&compmode=0&outkind=1&deflst=2&nzo=1"
          show permit_hist "https://data.taipei/api/dataset/e20ea68e-c79d-4882-a2f9-2f3eeb45384b/resource/2d9396af-863b-496a-9893-0d2f2a8d8b71/download"
          show permit_cur "https://data.taipei/api/dataset/d8834353-ff8e-4a6c-9730-a4d3541f2669/resource/43624c8e-c768-4b3c-93c4-595f5af7a9cb/download"
          show use_hist "https://data.taipei/api/dataset/c876ff02-af2e-4eb8-bd33-d444f5052733/resource/0f3f9675-8356-4f1a-9908-1ce8892012fa/download"
          show use_cur "https://data.taipei/api/dataset/0816f991-e6c8-4da0-a789-d022fee1462b/resource/74a8b311-906e-44c4-91fb-7f413842d4e1/download"
          show cbc_loans "https://www.cbc.gov.tw/public/data/OpenData/經研處/EF99M01.csv"
          show rent "https://data.taipei/api/dataset/029c6d0d-c880-4de7-b2fb-9e56669a6f20/resource/d7ace928-288e-4a47-9411-1ebf86d3dafb/download"
          show fsi "https://www.cbc.gov.tw/public/data/opendata/financialstability/FSI-不動產市場.csv"
          show permit_use_m2 "https://tsis.dbas.gov.taipei/statis/webMain.aspx?sys=220&ymf=10001&kind=21&type=0&funid=a05018702&cycle=1&outmode=12&compmode=0&outkind=1&deflst=2&nzo=1"

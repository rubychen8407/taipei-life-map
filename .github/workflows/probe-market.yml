name: probe market
on: { push: { branches: ['probe/market'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://plvr.land.moi.gov.tw/
          for s in 101S4 108S2 115S3; do for f in A_lvr_land_A.csv A_lvr_land_B.csv a_lvr_land_a.csv; do echo "== $s $f"; curl -sSL -m 120 "${B}DownloadSeason?season=$s&fileName=$f" -o f; ls -l f | awk '{print $5}'; file f; head -c 300 f | iconv -f utf-8 -t utf-8 -c; echo; python3 -c "
          t=open('f','rb').read().decode('utf-8-sig','replace').splitlines();print('rows',len(t))"; done; done
          time curl -sSL -m 300 "${B}DownloadSeason?season=113S1&type=zip&fileName=lvr_landcsv.zip" -o z.zip; ls -l z.zip

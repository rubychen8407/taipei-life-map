name: probe market
on: { push: { branches: ['probe/market'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 300 "https://data.gov.tw/datasets/export/csv" -o cat.csv
          python3 - <<'PY'
          import csv,io
          t=open('cat.csv','rb').read().decode('utf-8-sig',errors='replace')
          rows=list(csv.reader(io.StringIO(t)));h=rows[0]
          kw=['登記概況','移轉','價格指數','負擔能力','房價','住宅','購置住宅','建築貸款','房地產']
          for r in rows[1:]:
              d=dict(zip(h,r)); title=d.get('資料集名稱',''); org=d.get('提供機關','')
              if any(k in title for k in kw) and (('臺北' in title) or org in ('內政部','中央銀行','內政部地政司','內政部國土管理署','行政院主計總處','國家發展委員會','財政部','金融監督管理委員會')):
                  print(d.get('資料集識別碼'),'|',title,'|',org,'|',d.get('更新頻率'),'|',(d.get('資料下載網址') or '')[:200])
          PY

name: Probe building data
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: RP_DUMP=/tmp/rp_dump.json python3 scripts/build_realprice.py || true
      - run: mkdir out && cp data/realprice.json data/valuation.json out/ 2>/dev/null; gzip -c /tmp/rp_dump.json > out/rp_dump.json.gz; ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: rp, path: out }

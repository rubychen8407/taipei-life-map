name: Probe
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSM planned rail
        run: |
          python3 - <<'PY'
          import sys,json,collections; sys.path.insert(0,'scripts'); import build_data as B
          q='[out:json][timeout:120];(way["railway"~"construction|proposed"](24.95,121.40,25.22,121.70);way["construction:railway"](24.95,121.40,25.22,121.70);node["railway"~"construction|proposed"](24.95,121.40,25.22,121.70);node["construction:railway"](24.95,121.40,25.22,121.70);node["railway"="station"]["construction"](24.95,121.40,25.22,121.70);relation["state"~"construction|proposed"](24.95,121.40,25.22,121.70);relation["route"="construction"](24.95,121.40,25.22,121.70););out tags;'
          d=B.overpass(q); c=collections.Counter()
          for e in d['elements']:
            t=e['tags'];c[(e['type'],t.get('railway'),t.get('construction') or t.get('proposed') or t.get('construction:railway'),t.get('name','')[:24],t.get('line') or t.get('ref') or '',t.get('route',''),t.get('state',''))]+=1
          for k,v in c.most_common(150):print(v,k)
          PY

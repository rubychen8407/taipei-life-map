name: Build street tree data
# 每月用臺北市「行道樹分布圖」（公園處，dataset 128274）產生 data/trees.json
on:
  schedule:
    - cron: '41 19 3 * *'   # 每月 4 日 03:41（台北時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-trees
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_trees.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trees.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update street tree data $(date -u +%F)"
          git pull --rebase origin master
          git push

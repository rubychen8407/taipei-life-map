name: Build market overview data
# 每月用政府開放資料（地政局、實價登錄、建管處、央行、主計處）產生 data/market.json（整體房市頁面）
on:
  schedule:
    - cron: '7 20 24 * *'   # 每月 25 日 04:07（台北時間；央行房貸資料約每月 22 日公布）
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-market
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_market.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update market overview data $(date -u +%F)"
          git pull --rebase origin master
          git push

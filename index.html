/* iPhone Safari：大量毛玻璃（backdrop-filter）疊在會重繪的地圖上，會讓 Safari 漏畫圖層、畫面一直閃。
   觸控裝置改用不透明度較高的白色玻璃，不做即時模糊。 */
@media (hover:none),(pointer:coarse){
  .glass,.fab,#sheet,.chip .chip-icon,#scopeTag,.tune,.mode-menu,.life-card,#chips,#filterCard,#editbar,.pop,#pressMenu{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  :root{--glass:rgba(255,255,255,.93)}
  .chip .chip-icon{background:#F4F5F7}
}

function poiScore(pt){const ids=VALDATA.v.poi_layers;return ids.reduce((s,id)=>s+Math.max(0,Math.min(1,(20-poiNear(id,pt).d*1.25/80)/10)),0)/ids.length;}
function modelX(r){return[1,r.age,r.age*r.age/100,r.fl/r.tot,Math.log(r.ping),r.fl===1?1:0,r.fl===r.tot?1:0,r.s,r.t===1?1:0,r.t===2?1:0,r.t===2&&r.fl>=4?1:0];}
// 可比案例：同型態、近 24 個月、1.2 公里內、屋齡 ±12 年、坪數 0.5～2 倍，依相似度（距離、屋齡、坪數、樓層）取最像的 25 筆
function floorPen(s,r){const one=(s.fl===1)!==(r.fl===1)?1:0;return s.t===2?one*1.5+.4*Math.min(3,Math.abs(s.fl-r.fl)):one+Math.abs(s.fl/s.tot-r.fl/r.tot)/.3;}
function similarity(s,r,d){return d/300+Math.abs(r.age-s.age)/5+Math.abs(Math.log(r.ping/s.ping))/.3+floorPen(s,r);}
function estimate(sub){const {v,sales}=VALDATA,C=v.comps,now=v.now_ym,maxR=C.radii[C.radii.length-1],sb=C.size_band||[.5,2];
  const cand=[];for(const r of sales){if(r.t!==sub.t||Math.abs(r.age-sub.age)>C.age_band||now-r.ym>=C.months)continue;const k=r.ping/sub.ping;if(k<sb[0]||k>sb[1])continue;const d=distM(sub.pt,r.pt);if(d<=maxR)cand.push([d,r,similarity(sub,r,d)]);}
  cand.sort((a,b)=>a[2]-b[2]);const comps=cand.slice(0,C.min[0]),rad=comps.length?Math.round(Math.max(...comps.map(x=>x[0]))):maxR;
  const base=Math.exp(modelX(sub).reduce((a,x,i)=>a+x*v.model.b[i],0)+(v.model.dist[sub.dist]||0)+v.model.now);
  const res=comps.map(x=>x[1].e),ws=comps.map(x=>1/(1+Math.pow(x[0]/(C.w_scale||250),2))),sbar=comps.length?comps.reduce((a,x)=>a+x[1].s,0)/comps.length:0;
  const poi=comps.length?Math.max(-.08,Math.min(.08,Math.exp(v.model.b[v.feats.indexOf('poi')]*(sub.s-sbar))-1)):0;
  return{ok:comps.length>=C.min[1],n:comps.length,radius:rad,base,poi,comps,q:q=>base*Math.exp(C.w_scale?wquantile(res,ws,q):quantile(res,q))};}

function marketH(dist,t){const {v,fin}=VALDATA,T=VALDATA.types,seg=t!=null?v.market[dist+'|'+t]:null,md=v.market[dist]||v.market['全市'],cl=x=>Math.max(-1,Math.min(1,x)),parts=[],pc=x=>Math.abs(x*100).toFixed(x*100>=10||x*100<=-10?0:1);

function amort(P,n,g,rateOf){const out=new Array(n);let b=P;for(let m=0;m<n;m++){const r=rateOf(Math.floor(m/12))/1200,it=b*r;let p;if(m<g)p=it;else{const k=n-m;p=r?b*r/(1-Math.pow(1+r,-k)):b/k;}out[m]=p;b-=p-it;}return out;}

    g+=F([w.uB,w.uR,[m(w.uB,w.uR)[0],m(w.uB,w.uR)[1]-r+.8]],wallR);
    const ch=box(R1[0]+(R2[0]-R1[0])*.6+2.6,R1[1]+(R2[1]-R1[1])*.6+3.4,1.6,4.6);
    g+=F([eL,eB,R2,R1],roofL,2)+F([eT,eR,R2,R1],roofR,2);
    g+=F([ch.B,ch.L,ch.uL,ch.uB],roofL,1.2)+F([ch.B,ch.R,ch.uR,ch.uB],roofR,1.2)+F([ch.uB,ch.uL,ch.uT,ch.uR],C(lv+6,sat+18),1.2);
    g+=`<polyline points="${P([eL,eB,R2])}" fill="none" stroke="${C(lv+16,sat+10,.8)}" stroke-width=".7" stroke-linejoin="round"/>`;
  }else{ // 平頂＋內凹女兒牆
    const tp=[w.uB,w.uL,w.uT,w.uR],ctr=[cx,w.uB[1]-s/2],k=.74,inn=tp.map(p=>[ctr[0]+(p[0]-ctr[0])*k,ctr[1]+(p[1]-ctr[1])*k+.6]);
    g+=F(tp,topC,1.8)+F(inn,inset,1.2)+`<polyline points="${P([inn[1],inn[2],inn[3]])}" fill="none" stroke="${C(lv-12,sat,.7)}" stroke-width=".7" stroke-linejoin="round"/>`;
  }
  g+=`<line x1="${w.B[0]}" y1="${(w.B[1]-.6).toFixed(2)}" x2="${w.uB[0]}" y2="${(w.uB[1]+.8).toFixed(2)}" stroke="rgba(255,255,255,.55)" stroke-width=".7" stroke-linecap="round"/>`; // 前稜線反光
  const badge=n>1?`<g transform="translate(${cx+s+3.5},${by-pt-H-s-4})"><rect x="-6.5" y="-6" width="${n>9?15:13}" height="12" rx="6" fill="#1D1D1F" stroke="#fff" stroke-width="1.2"/><text x="${n>9?1:0}" y="3.4" font-size="8.2" font-weight="700" text-anchor="middle" fill="#fff" font-family="-apple-system,'SF Pro',sans-serif">${n}</text></g>`:'';
  return `<svg viewBox="0 0 48 54" width="${px}" height="${Math.round(px*54/48)}" style="overflow:visible" aria-hidden="true"><defs><filter id="cB" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="1.7"/></filter>
    <linearGradient id="cL${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wallL}"/><stop offset="1" stop-color="${wallL2}"/></linearGradient><linearGradient id="cR${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wallR}"/><stop offset="1" stop-color="${wallR2}"/></linearGradient></defs>${g}${badge}</svg>`;
}
function priceBase(up,lo,hi){const t=Math.max(0,Math.min(1,(up-lo)/((hi-lo)||1)));return[Math.round(222-190*t),78,Math.round(42+10*t)];}
function dealIcon(t,base,n){return L.divIcon({className:'deal-iso',html:clayIcon(t,base,n,64),iconSize:[64,72],iconAnchor:[29,64],popupAnchor:[0,-58]});}
function clusterIcon(n,b,base){const d=Math.round(34+Math.min(16,Math.log2(n)*3.2));return L.divIcon({className:'deal-cl',html:`<span style="width:${d}px;height:${d}px;background:hsl(${base[0]} ${base[1]}% ${base[2]}%)"><b>${n}</b>${b>1?`<small>${b} 棟</small>`:''}</span>`,iconSize:[d,d],iconAnchor:[d/2,d/2]});}
const DEAL_MAX=10; // 一個畫面最多畫 10 棟建物，其餘就近聚合成數字（成交筆數）
// 「實價登錄成交」圖層：放大到街區才畫；同一個門牌位置的多筆成交合成一個圖示（右上角數字＝筆數），點了看每一筆的房屋資訊
let dealSeq=0;async function drawDeals(){const seq=++dealSeq,lg=$('dealLegend');if(!state.layers.deal||state.transit||state.drawing||state.editing){dealLayer.clearLayers();lg.hidden=true;return;}
  try{await loadVal();}catch(e){dealLayer.clearLayers();lg.hidden=true;if(state.layers.deal){state.layers.deal=false;toast('實價登錄資料還沒建好，暫時無法顯示',true);if(!$('layersPop').hidden)renderLayersPop();}return;}
  if(seq!==dealSeq)return;dealLayer.clearLayers();lg.hidden=false;if(map.getZoom()<13){lg.hidden=true;if(!state.dealHint){state.dealHint=true;toast('放大地圖就會顯示成交點');}return;}
  const b=map.getBounds().pad(.05),vis=VALDATA.sales.filter(r=>b.contains(r.pt)),ups=vis.map(r=>r.up),lo=quantile(ups,.1),hi=quantile(ups,.9),groups=new Map();
  for(const r of vis){const k=r.pt[0]+','+r.pt[1];if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);}
  const bl=[...groups.values()].map(g=>{g.sort((x,y)=>y.ym-x.ym);const p=map.latLngToContainerPoint(g[0].pt);return{g,x:p.x,y:p.y};});
  lg.innerHTML=VALDATA.types.map((n,i)=>`<span class="dl-t">${clayIcon(i,[[218,70,50],[150,48,44],[20,84,54]][i],1,22)}${n}</span>`).join('')+`<span class="dl-c"><span>${(lo||0).toFixed(0)}</span><i></i><span>${(hi||0).toFixed(0)} 萬／坪</span></span><span class="dl-n"><b>12</b>聚合的成交筆數</span>`;
  // 先挑最多 10 棟單獨顯示：成交筆數多的優先、彼此在螢幕上至少隔 64 px；其餘依格子聚合成數字（格子大小讓一個畫面約 14 個以內）
  let cells;
  if(bl.length<=DEAL_MAX)cells=bl.map(o=>[o]);
  else{const c0=map.latLngToContainerPoint(map.getCenter()),pick=[],rest=[];
    bl.sort((p,q)=>q.g.length-p.g.length||Math.hypot(p.x-c0.x,p.y-c0.y)-Math.hypot(q.x-c0.x,q.y-c0.y));
    for(const o of bl){if(pick.length<DEAL_MAX&&pick.every(p=>Math.hypot(p.x-o.x,p.y-o.y)>=64))pick.push(o);else rest.push(o);}
    const sz=map.getSize(),cs=Math.max(110,Math.sqrt(sz.x*sz.y/14)),m=new Map();for(const o of rest){const k=Math.floor(o.x/cs)+','+Math.floor(o.y/cs);if(!m.has(k))m.set(k,[]);m.get(k).push(o);}
    cells=pick.map(o=>[o]).concat([...m.values()].map(c=>Object.assign(c,{cl:true})));}
  state.dealView={buildings:cells.filter(c=>!c.cl).length,clusters:cells.filter(c=>c.cl).length};
  cells.forEach(c=>{if(!c.cl){const g=c[0].g,med=quantile(g.map(x=>x.up),.5);
      L.marker(g[0].pt,{icon:dealIcon(g[0].t,priceBase(med,lo,hi),g.length),title:`${VALDATA.types[g[0].t]}・${med.toFixed(1)} 萬／坪`,bubblingMouseEvents:false,riseOnHover:true})
        .on('click',()=>{if(state.drawing||state.editing)return;openDealPop(g);}).addTo(dealLayer);return;}
    const all=c.flatMap(o=>o.g),med=quantile(all.map(x=>x.up),.5),la=c.reduce((a,o)=>a+o.g[0].pt[0],0)/c.length,ln=c.reduce((a,o)=>a+o.g[0].pt[1],0)/c.length;
    L.marker([la,ln],{icon:clusterIcon(all.length,c.length,priceBase(med,lo,hi)),title:`${c.length} 棟、${all.length} 筆成交，單價中位數 ${med.toFixed(1)} 萬／坪`,bubblingMouseEvents:false,zIndexOffset:500})
      .on('click',()=>{if(state.drawing||state.editing)return;const bb=L.latLngBounds(c.map(o=>o.g[0].pt));if(map.getZoom()>=18||bb.getNorthEast().equals(bb.getSouthWest()))map.setView(bb.getCenter(),Math.min(19,map.getZoom()+2));else fit(bb,{maxZoom:19});}).addTo(dealLayer);});}
function openDealPop(g){const T=VALDATA.types,r0=g[0],show=g.slice(0,5);
  const html=`<div class="dp"><div class="dp-h"><span class="dp-ic">${clayIcon(r0.t,[217,60,46],1,32)}</span><div><b>${T[r0.t]}・${r0.tot} 層樓</b><small>屋齡約 ${r0.age} 年・${g.length} 筆成交（近 24 個月）</small></div></div>`+
    show.map((r,i)=>`<div class="dp-r"><div><b>${r.up.toFixed(1)} 萬／坪</b><small>${ymTxt(r.ym)}・${r.ping.toFixed(1)} 坪・${r.fl}/${r.tot} 樓・總價約 ${wan(r.up*r.ping)}</small></div><button type="button" class="dp-use" data-di="${i}" aria-label="用這筆的條件估價">估價 ›</button></div>`).join('')+
    (g.length>show.length?`<div class="dp-more">還有 ${g.length-show.length} 筆較早的成交</div>`:'')+`<div class="dp-note">總價不含車位；實價登錄門牌只到同一棟，不代表同一戶</div></div>`;
  L.popup({className:'deal-pop',closeButton:false,maxWidth:300,minWidth:240,autoPanPaddingTopLeft:[10,$('top').offsetHeight+16],autoPanPaddingBottomRight:[10,(state.sheetVis||0)+76]}).setLatLng(r0.pt).setContent(html).openOn(map);
  setTimeout(()=>document.querySelectorAll('.deal-pop .dp-use').forEach(b=>b.onclick=()=>{const r=show[+b.dataset.di];map.closePopup();openVal(r.pt,{t:r.t,ping:Math.round(r.ping*10)/10,age:Math.max(1,r.age),fl:r.fl,tot:r.tot,ask:''});}),0);}

// ---------- main flow ----------
async function run(){const seq=++state.seq;state.err=null;saveLast();drawLifeCenters();
  drawFlags();if((!state.baked&&state.scope==='')||(!state.active.size&&!activeFlags().length)){state.res=null;state.zones=[];drawHeat();drawPins();drawFacilities();render();return;}
  if(!state.baked){const need=[...new Set([...state.active,'mrt'])];
    if(need.some(id=>!data(id))){state.res=null;drawHeat();drawPins();render();busy(true);
      try{await ensureLive(need);}catch(e){busy(false);if(seq===state.seq){state.err=e;render();toast('下載失敗：'+e.message,true);}return;}
      busy(false);if(seq!==state.seq)return;}}
  if(state.baked&&state.active.has('sidewalk')&&!state.store.city.sidewalk){busy(true);await loadSidewalk();busy(false);if(seq!==state.seq)return;}
  const act=[...state.active];if(needDist(act)){busy(true);await ensureDist(act);busy(false);if(seq!==state.seq)return;}
  analyze();drawHeat();drawPins();drawFacilities();render();warmDist();}
(async()=>{tlmMark('程式就緒');const fromLink=cloudFromHash();let late=null;
  if(SBA){const p=cloudPull();const ch=await Promise.race([p,new Promise(r=>setTimeout(()=>r(null),2500))]);if(ch)applyPersonal(ch);else late=p;if(fromLink)setTimeout(()=>toast(SBA?'已登入，個人資料會自動同步到雲端':'登入失敗',!SBA),300);}
  tlmMark('雲端');  try{const last=JSON.parse(localStorage.getItem('tlm.last')||'null');if(last)setFilterState(last);}catch(e){}
  drawHomes();drawFuture();
  fillScope();renderCategorySettings();$('resultBtn').onclick=()=>setSheet('half');setSheet('peek',false);render();drawScope(true);busy(true);
  tlmMark('畫面');await loadBaked();tlmMark('全市資料');busy(false);state.loading=false;run();tlmMark('計算完成');warmCache();drawTrees();drawLand();drawUrban();(window.requestIdleCallback||(f=>setTimeout(f,300)))(()=>drawSale());if(/[#&]import=/.test(location.hash))await importFromHash();else geocodeAll();syncListings().then(()=>tlmMark('私人房源'));if(late)late.then(ch=>afterCloud(ch,false));})();
</script>

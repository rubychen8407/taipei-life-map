<style>
:root{--blue:#0b57d0;--bluebg:#d3e3fd;--ink:#1f1f1f;--sub:#5f6368;--line:#e3e3e3;--teal:#00695c;--shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;font-size:15px;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:absolute;inset:0;background:#e8eaed}
.leaflet-control-attribution{font-size:9px;opacity:.75}
#top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;pointer-events:none;max-height:48vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}#top::-webkit-scrollbar{display:none}
#top>*{pointer-events:auto}
.search{position:relative;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:#fff;border-radius:24px;box-shadow:var(--shadow);font-size:16px;font-weight:600}

.search select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
#chips{display:flex;align-items:center;gap:8px;margin:10px -10px 0;padding:0 10px 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:82px;width:auto;padding:0 11px;border:1px solid rgba(60,64,67,.10);border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.22),0 1px 3px 1px rgba(60,64,67,.10);font-size:13px;font-weight:600;white-space:nowrap;line-height:1}
.chip[aria-pressed=true]{background:var(--bluebg);color:var(--blue);border-color:rgba(11,87,208,.22)}
.chip .chip-name{display:inline-block;flex:none;white-space:nowrap;font-size:13px;line-height:1.2}
.chip .ck{display:none;flex:none;font-size:12px}
.chip .mins{flex:none;margin-left:0;padding:3px 5px;border-radius:10px;background:#f1f3f4;color:#5f6368;font-size:10px;font-weight:700;line-height:1;white-space:nowrap}.chip[aria-expanded=true]{outline:2px solid var(--blue);outline-offset:1px}
.distance-settings{display:grid;gap:9px;margin:8px 0 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(60,64,67,.18)}.distance-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:#3c4043}.distance-value{font-size:14px;color:var(--blue);font-weight:750;font-variant-numeric:tabular-nums}.distance-range{width:100%;height:28px;margin:0;accent-color:var(--blue);cursor:pointer;touch-action:pan-y}.distance-scale{display:flex;justify-content:space-between;color:var(--sub);font-size:11px}.distance-hint{font-size:11px;color:var(--sub)}.mode-options{display:flex;gap:8px;align-items:center}.mode-option{width:42px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:11px;background:#fff;color:#5f6368}.mode-option svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mode-option.selected{color:var(--blue);background:var(--bluebg);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.chip-icon{display:inline-flex;flex:none;align-items:center;justify-content:center}.chip-icon svg{width:19px;height:19px}.chip .mins{font-size:10px;padding:3px 5px}
.chip[aria-pressed=true] .ck{display:inline}
#drawbar{display:none;margin-top:10px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px}
#drawbar .btns{display:flex;gap:8px;margin-top:8px}
.btn{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
#bar{position:absolute;z-index:1200;top:0;left:0;right:0;height:3px;overflow:hidden;display:none}
#bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--blue);animation:bar 1s infinite linear}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#fabs{position:absolute;z-index:900;right:12px;bottom:calc(var(--sheetvis,300px) + 14px);display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
.fab{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);font-size:20px;display:flex;align-items:center;justify-content:center}

.seg{display:flex;margin-top:10px;background:#f1f3f4;border-radius:20px;padding:3px}

#body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;border-top:1px solid var(--line)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin:10px 0 2px}
.legend .grad{flex:none;width:86px;height:8px;border-radius:4px;background:linear-gradient(90deg,#004d40,#80cbc4)}
.legend .sw{flex:none;width:14px;height:8px;border-radius:4px;background:#ffb74d;margin-left:8px}
h2{font-size:14px;margin:16px 0 6px;color:var(--sub);font-weight:600}
.card{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rank{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.card .t{font-weight:600}
.card .m{color:var(--sub);font-size:12.5px;margin-top:2px}
.card .go{margin-left:auto;color:#bdc1c6;font-size:20px}
.drow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.drow .n{flex:none;width:64px;font-size:13.5px}
.drow .b{flex:1;height:8px;border-radius:4px;background:#f1f3f4;overflow:hidden}
.drow .b i{display:block;height:100%;background:#26a69a;border-radius:4px}
.drow .p{flex:none;width:44px;text-align:right;font-size:12.5px;color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ic{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px}
.row .t{font-weight:600;font-size:14px}
.row .m{color:var(--sub);font-size:12.5px;margin-top:1px}
.row .time{margin-left:auto;font-weight:700;white-space:nowrap}
.ok{color:#137333}.no{color:#b3261e}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;font-size:13px;font-weight:600;margin-top:12px}
.verdict.ok{background:#e6f4ea}.verdict.no{background:#fce8e6}
.note{background:#f8f9fa;border-radius:12px;padding:12px;font-size:13px;color:var(--sub);margin-top:12px;line-height:1.5}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.foot{font-size:11px;color:#9aa0a6;margin-top:18px;line-height:1.5}
.freq{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin-top:12px}
.freq i{display:inline-block;width:22px;border-radius:3px;vertical-align:middle;margin-right:5px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#f1f3f4,#e8eaed,#f1f3f4);background-size:200% 100%;animation:sk 1.2s infinite;margin:14px 0}
@keyframes sk{to{background-position:-200% 0}}
.dlabel{width:auto!important;height:auto!important;white-space:nowrap;font-size:12px;font-weight:700;color:#3c4043;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.dlabel span{display:inline-block;transform:translate(-50%,-50%)}
.zpin{width:26px!important;height:26px!important;margin:-13px 0 0 -13px!important;border-radius:50%;background:var(--teal);border:2px solid #fff;color:#fff;font-weight:700;font-size:12px;line-height:22px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin{width:30px!important;height:30px!important;margin:-30px 0 0 -15px!important;font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.facility-marker{background:transparent;border:0}
.facility-marker .facility-bubble{width:32px;height:32px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 4px rgba(60,64,67,.38);color:#fff}
.facility-marker svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.facility-marker .facility-name{position:absolute;left:50%;top:35px;transform:translateX(-50%);max-width:150px;padding:3px 7px;border-radius:7px;background:#fff;color:#202124;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(60,64,67,.25);pointer-events:auto;cursor:pointer}
 .detail-category{display:inline-flex;align-items:center;gap:6px;width:max-content;margin-bottom:5px;padding:3px 8px;border-radius:12px;background:#f1f3f4;color:#5f6368;font-size:12px;font-weight:600}.detail-category svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
 .distance-settings{display:grid;gap:8px;margin:8px 0 0;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(60,64,67,.18)}.distance-title{font-size:12px;font-weight:700;color:#3c4043}.distance-row{display:flex;align-items:center;gap:8px;min-height:32px}.distance-row .swatch{width:9px;height:9px;border-radius:50%;flex:none}.distance-row .name{flex:1;font-size:12px;font-weight:600}.distance-row select{height:30px;min-width:96px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.category-settings{max-height:38vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.category-settings::-webkit-scrollbar{display:none}.life-panel{margin:8px 0 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(60,64,67,.18);display:grid;gap:9px;max-height:calc(100dvh - 180px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.life-panel[hidden]{display:none}.life-panel .life-heading{font-size:13px;font-weight:700}.life-panel .life-hint{font-size:12px;color:var(--sub);line-height:1.4}.life-centers{display:grid;gap:6px}.life-label{background:#fff;border:0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:700;padding:2px 6px}.life-center-row{display:flex;align-items:center;gap:6px;min-width:0}.life-center-row input{min-width:0;flex:1;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:13px}.life-center-row button{height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.life-actions{display:flex;gap:8px}.life-actions .btn{flex:1}.life-chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border:0;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);font-size:14px;font-weight:500;white-space:nowrap}.life-chip[aria-pressed=true]{background:var(--bluebg);color:var(--blue)}.life-chip svg,.chip svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.life-tabs{display:flex;gap:7px;margin:8px 0}.life-tabs button{border:1px solid var(--line);border-radius:16px;background:#fff;padding:6px 12px;font-size:12px}.life-tabs button[aria-pressed=true]{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}.life-way{stroke-linecap:round;stroke-linejoin:round}.life-center-marker{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;color:#fff;font-weight:800;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.4)}.life-result-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.life-result-row .life-result-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex:none}.life-result-row .life-result-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.life-result-row .life-result-distance{margin-left:auto;font-weight:700;white-space:nowrap;font-size:13px}.distance-title{font-size:13px;font-weight:700;color:#3c4043}.distance-row{display:flex;align-items:center;gap:8px;min-height:34px}.distance-row .swatch{width:10px;height:10px;border-radius:50%;flex:none}.distance-row .name{flex:1;font-size:13px;font-weight:600}.distance-row select{height:32px;min-width:96px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.me{width:18px!important;height:18px!important;margin:-9px 0 0 -9px!important;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.2)}
.trow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.trow.sel{background:#e8f0fe}.tbadge{flex:none;width:84px;padding:4px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:13px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 2px rgba(0,0,0,.45)}.tmain{flex:1;min-width:0}.trow .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trow .m{font-size:12px;color:var(--sub)}
.tr-end{background:#fff;border:2px solid #333;border-radius:6px;font-size:11px;font-weight:700;padding:0 4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3);width:auto!important;height:auto!important}
.tr-origin{border-radius:50%;background:#ea4335;border:3px solid #fff;box-shadow:0 0 0 5px rgba(234,67,53,.3);color:#fff;font-weight:700;font-size:12px;text-align:center;line-height:20px}
.leaflet-tooltip.lbl{background:rgba(255,255,255,.92);border:none;box-shadow:0 1px 2px rgba(0,0,0,.2);font-size:11px;padding:1px 5px;color:#333}
@media (min-width:700px){
  #top{right:auto;width:390px}
  #sheet{left:10px;right:auto;width:390px;top:122px;bottom:10px;height:auto!important;border-radius:16px;transform:none!important;box-shadow:var(--shadow)}
  .handle{visibility:hidden;margin:4px auto}

/* ===== 新版：寶藍＋橘、毛玻璃 ===== */
:root{--D:#123B8A;--A:#F7931E;--ink:#1D1D1F;--sub:#86868B;--line:rgba(60,60,67,.12);--blue:#123B8A;--bluebg:#E9EEF8;--teal:#123B8A;--glass:rgba(255,255,255,.72);--shadow:0 .5px 0 rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.09)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
.glass,.fab,#sheet,.chip .chip-icon,#scopeTag,.tune,.mode-menu,.life-card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
#top svg,#fabs svg,.pop svg,#pressMenu svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
#top{top:14px;left:12px;right:12px;max-height:none;overflow:visible}
.search[hidden]{display:none!important}
#chips{display:flex;justify-content:space-between;gap:0;margin:0;padding:0;overflow:visible}
.chip{flex:0 0 44px;min-width:0;width:44px;height:auto;padding:0;border:0;border-radius:0;background:none!important;box-shadow:none!important;outline:none!important;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.chip .chip-icon{position:relative;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:box-shadow .2s,color .2s}
.chip .chip-icon>svg{width:19px;height:19px}
.chip[aria-pressed=true] .chip-icon{color:var(--D);box-shadow:inset 0 0 0 1.5px var(--D),var(--shadow)}
.chip[aria-expanded=true] .chip-icon{box-shadow:inset 0 0 0 1.5px var(--D),0 0 0 3px var(--A)}
.chip .chip-name,.chip .mins{font-size:10px;line-height:1.2;letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;padding:0;margin:0;background:none;border-radius:0}
.chip .chip-name{color:#5F6368;font-weight:400}
.chip .mins{display:none;color:var(--D);font-weight:600}
.chip[aria-pressed=true] .chip-name{display:none}.chip[aria-pressed=true] .mins{display:block}
.chip .ck{display:none!important}
.chip .badge{display:none;position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:9px;background:var(--A);color:var(--D);align-items:center;justify-content:center;box-shadow:0 0 0 1.5px #fff}
.chip .badge svg{width:11px;height:11px;stroke-width:2.2}
.chip[aria-pressed=true] .badge{display:flex}
.category-settings{max-height:none;overflow:visible;position:relative}
.tune{position:relative;width:258px;margin-top:10px;height:52px;border-radius:26px;box-shadow:var(--shadow);border:.5px solid rgba(255,255,255,.7);display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.mode-btn{flex:none;display:flex;align-items:center;gap:1px;height:36px;padding:0 6px 0 9px;border-radius:18px;border:0;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);color:var(--D)}
.mode-btn svg{width:18px;height:18px}.mode-btn svg+svg{width:14px;height:14px}
.tune .distance-range{flex:1;min-width:0;margin:0;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.tune .distance-range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--A) var(--p,50%),rgba(120,120,128,.2) var(--p,50%))}
.tune .distance-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#fff;margin-top:-10px;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.18)}
.tune .distance-range::-moz-range-track{height:4px;border-radius:2px;background:rgba(120,120,128,.2)}.tune .distance-range::-moz-range-progress{height:4px;border-radius:2px;background:var(--A)}
.tune .distance-range::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:12px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.tune .distance-value{flex:none;width:42px;text-align:right;font-size:15px;font-weight:600;color:var(--D);font-variant-numeric:tabular-nums}
.mode-menu{position:absolute;left:8px;top:56px;z-index:2;width:44px;padding:4px 0;border-radius:22px;border:.5px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;gap:2px}
.mode-menu[hidden]{display:none}
.mode-option{width:36px;height:36px;border-radius:18px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.mode-option svg{width:18px;height:18px}
.mode-option[aria-pressed=true]{background:rgba(18,59,138,.12);color:var(--D)}
.life-card{margin-top:8px;width:280px;box-sizing:border-box;padding:10px 12px;border-radius:18px;box-shadow:var(--shadow);display:grid;gap:6px}
.life-center-row{display:flex;align-items:center;gap:6px;min-width:0}.life-center-row b{width:16px;text-align:center}
.life-center-row input{flex:1;min-width:0;height:32px;border:0;border-radius:10px;background:rgba(120,120,128,.1);padding:0 8px;font-size:14px}
.life-center-row button,.life-card .life-done{flex:none;height:30px;padding:0 9px;border:0;border-radius:15px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);font-size:12px;color:var(--D)}
.life-card .distance-hint{font-size:11px;color:#5F6368;line-height:1.4}
.life-card .life-done{justify-self:end;font-weight:600}
#scopeTag{display:inline-flex;align-items:center;gap:6px;height:30px;margin-top:10px;padding:0 4px 0 12px;border-radius:15px;box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--D)}
#scopeTag[hidden]{display:none}
#scopeTag button{width:24px;height:24px;border-radius:12px;border:0;background:rgba(120,120,128,.14);color:#5F6368;font-size:11px;padding:0}
#fabs{right:12px;gap:10px}
.fab{width:44px;height:44px;border-radius:22px;box-shadow:var(--shadow);color:var(--ink);border:0}
.fab svg{width:19px;height:19px}
.fab[aria-expanded=true]{color:var(--D);box-shadow:inset 0 0 0 1.5px var(--D),0 0 0 3px var(--A)}
.pop{position:absolute;z-index:1150;right:66px;bottom:calc(var(--sheetvis,76px) + 14px);border-radius:20px;border:.5px solid rgba(255,255,255,.7);box-shadow:0 8px 28px rgba(0,0,0,.16);animation:pop .18s ease-out}
.pop[hidden],#regionPop[hidden],#layersPop[hidden],#pressMenu[hidden],#scopeTag[hidden]{display:none!important}
#regionPop{width:228px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#regionPop button{height:34px;border-radius:17px;border:0;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);font-size:13px;color:var(--ink);padding:0}
#regionPop button[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--D);color:var(--D);font-weight:600}
#regionPop .wide{grid-column:span 3}
#regionPop .draw{background:none;box-shadow:none;color:var(--D);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
#regionPop .draw svg{width:16px;height:16px}
#layersPop{width:292px;max-height:calc(100dvh - var(--sheetvis,76px) - 120px);overflow-y:auto;padding:14px;display:grid;gap:10px}
#layersPop h3{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
#layersPop h3 small{font-size:12px;color:#5F6368;font-weight:400}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;height:30px;padding:0 12px;border-radius:15px;border:0;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);font-size:12px;color:var(--ink)}
.presets button[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--D);color:var(--D);font-weight:600}
.presets .save{background:var(--A);color:#fff;box-shadow:none;font-weight:600;display:flex;align-items:center;gap:4px}.presets .save svg{width:13px;height:13px;stroke-width:2}
.lgroup-h{display:flex;align-items:center;justify-content:space-between;margin:2px 2px -4px;font-size:12px;font-weight:600}
.lgroup-h button{height:26px;padding:0 10px;border-radius:13px;border:0;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);color:var(--D);font-size:11px}
.lgroup{background:rgba(255,255,255,.7);border-radius:12px;padding:0 12px}
.lrow{display:flex;align-items:center;gap:12px;height:46px;border-top:.5px solid var(--line)}.lrow:first-child{border-top:0}
.lrow svg{width:19px;height:19px;flex:none}.lrow span{flex:1;font-size:15px}
.switch{flex:none;width:51px;height:31px;border-radius:16px;border:0;background:rgba(120,120,128,.16);position:relative;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:left .2s}
.switch[aria-pressed=true]{background:var(--D)}.switch[aria-pressed=true]::after{left:22px}
.switch:disabled{opacity:.4}
#pressMenu{position:absolute;z-index:1160;height:48px;padding:0 4px;border-radius:24px;border:.5px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:4px;transform:translate(-50%,-100%);animation:pop .16s ease-out}
#pressMenu[hidden]{display:none}
#pressMenu button{width:40px;height:40px;border-radius:20px;border:0;background:none;color:var(--D);display:flex;align-items:center;justify-content:center;padding:0}
#pressMenu button svg{width:19px;height:19px}
#pressMenu button.hi{background:var(--A);color:#fff}
.press-dot{width:16px!important;height:16px!important;margin:-8px 0 0 -8px!important;border-radius:50%;background:var(--D);border:2px solid #fff;box-shadow:0 0 0 8px rgba(247,147,30,.3),0 2px 6px rgba(0,0,0,.25)}
#sheet{left:8px;right:8px;bottom:8px;height:calc(88vh - 8px);border-radius:28px;box-shadow:var(--shadow);border:.5px solid rgba(255,255,255,.7)}
.handle{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.18);margin:8px auto 8px}
#grab{padding:0 20px 10px}
#body{border-top:.5px solid var(--line);padding:4px 20px 24px}
.sumline{display:flex;align-items:center;gap:8px;font-size:15px;height:28px}
.sumline .dot{flex:none;width:10px;height:10px;border-radius:5px;background:var(--A)}
.sumline .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumline b{flex:none;color:var(--D);font-weight:600}.sumline .r{flex:none;color:#5F6368;font-size:13px}
.rank,.zpin{background:var(--D)!important}
.drow .b i{background:var(--A)}
.dlabel{font-size:11px;font-weight:500;letter-spacing:.08em;color:rgba(29,29,31,.6);cursor:pointer}
@media (min-width:700px){#top{width:390px;right:auto}#sheet{left:10px;top:150px;width:390px}.pop{bottom:24px}}

/* 類別列成為一個毛玻璃小組；地圖 POI 與上方圖示同款 */
#chips{padding:7px 8px 5px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow);border:.5px solid rgba(255,255,255,.7)}
.chip .chip-icon{background:rgba(255,255,255,.75);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.chip[aria-pressed=true] .chip-icon{box-shadow:inset 0 0 0 1.5px var(--D)}
.chip .chip-name,.chip .mins{text-shadow:none}
.facility-marker .facility-bubble{width:30px;height:30px;background:rgba(255,255,255,.9)!important;color:var(--D);border:0;box-shadow:inset 0 0 0 1.5px var(--D),0 2px 6px rgba(0,0,0,.18)}
.facility-marker svg{width:17px;height:17px;stroke-width:1.6}

#regionPop .rp-h{font-size:11px;color:#5F6368;text-align:center;height:auto}
.dlabel.on span{color:#123B8A;font-weight:700}

#editbar{display:none;margin-top:10px;padding:10px 12px;border-radius:18px;font-size:13px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow)}
#editbar .btns{display:flex;gap:8px;margin-top:8px}
#scopeTag svg{width:13px;height:13px;margin:auto}
.vh{width:18px!important;height:18px!important;margin:-9px 0 0 -9px!important;border-radius:50%;background:#fff;border:2.5px solid #123B8A;box-shadow:0 1px 4px rgba(0,0,0,.3);box-sizing:border-box}
.vh.mid{width:12px!important;height:12px!important;margin:-6px 0 0 -6px!important;border:2px solid #F7931E;opacity:.85}

/* iPhone Safari：大量毛玻璃（backdrop-filter）疊在會重繪的地圖上，會讓 Safari 漏畫圖層、畫面一直閃。
   觸控裝置改用不透明度較高的白色玻璃，不做即時模糊。 */
@media (hover:none),(pointer:coarse){
  .glass,.fab,#sheet,.chip .chip-icon,#scopeTag,.tune,.mode-menu,.life-card,#chips,#editbar,.pop,#pressMenu{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  :root{--glass:rgba(255,255,255,.93)}
  .chip .chip-icon{background:#F4F5F7}
}
</style>
</head>

  el.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{state.layers[b.dataset.layer]=!state.layers[b.dataset.layer];applyLayers();});
  el.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const g=LAYER_GROUPS[+b.dataset.group],all=g.items.every(x=>state.layers[x[0]]);g.items.forEach(x=>state.layers[x[0]]=!all);applyLayers();});
  el.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=loadPresets()[+b.dataset.preset];layerKeys().forEach(k=>state.layers[k]=!!p.layers[k]);applyLayers();});
  const sv=el.querySelector('[data-save-preset]');if(sv)sv.onclick=()=>{const a=loadPresets();if(a.some(samePreset)){toast('這個組合已經存過了');return;}a.push({name:'組合 '+(a.length+1),layers:Object.fromEntries(layerKeys().map(k=>[k,!!state.layers[k]]))});savePresets(a);renderLayersPop();toast('已儲存為「組合 '+a.length+'」');};}
function applyLayers(){drawHeat();drawPins();drawFacilities();if(state.layers.transit){if(!map.hasLayer(transitLayer))transitLayer.addTo(map);}else if(map.hasLayer(transitLayer))map.removeLayer(transitLayer);if(!$('layersPop').hidden)renderLayersPop();}
// ---------- 長按地圖：圖示工具選單 ----------
let pressLL=null,pressT=null,pressAt=0;const pressLayer=L.layerGroup().addTo(map);
function closePress(){if($('pressMenu').hidden)return false;$('pressMenu').hidden=true;pressLayer.clearLayers();pressLL=null;return true;}
function openPress(ll){if(state.drawing||state.editing)return;closePops('press');closeTune();pressAt=Date.now();pressLL=ll;pressLayer.clearLayers();
  L.marker(ll,{icon:L.divIcon({className:'press-dot',iconSize:[16,16]}),interactive:false,zIndexOffset:1500}).addTo(pressLayer);
  const p=map.latLngToContainerPoint(ll),m=$('pressMenu');
  m.innerHTML=`<button type="button" class="hi" data-press="life" aria-label="加入生活圈" title="加入生活圈">${categoryIcon('life')}</button><button type="button" data-press="info" aria-label="這裡的生活機能" title="這裡的生活機能">${categoryIcon('info')}</button><button type="button" data-press="transit" aria-label="附近的大眾運輸" title="附近的大眾運輸">${categoryIcon('mrt')}</button>`;
  m.hidden=false;const w=m.offsetWidth;m.style.left=Math.max(w/2+8,Math.min(innerWidth-w/2-8,p.x))+'px';m.style.top=Math.max(130,p.y-18)+'px';
  m.querySelectorAll('[data-press]').forEach(b=>b.onclick=()=>pressAction(b.dataset.press));}
function pressAction(a){const ll=pressLL;closePress();if(!ll)return;const pt=[ll.lat,ll.lng];
  if(a==='life'){if(state.lifeCenters.length>=3){toast('生活圈最多 3 個地點，請先刪除一個');return;}
    state.lifeCenters.push({label:['住家','公司','常去地點'][state.lifeCenters.length]||'地點',center:pt});state.active.add('life');toast('已加入生活圈「'+state.lifeCenters[state.lifeCenters.length-1].label+'」');lifeChanged();return;}
  if(a==='info'){const k=cellAtLatLng(pt[0],pt[1]);if(k<0||!state.res||isNaN(state.res.worst[k])){toast('這個位置不在分析範圍內');return;}openCell(k,{title:'這個位置'});return;}
  if(a==='transit'){let best=null,bd=600,bl=null;for(const id of ['mrt','bus']){for(const f of (data(id)||[])){const d=md(f.center,pt)*(id==='mrt'?.6:1);if(d<bd){bd=d;best=f;bl=LAYER[id];}}}
    if(!best){toast('附近 600 公尺內沒有車站');return;}openPlace(best,bl);}}
(()=>{const mc=map.getContainer();let p0=null,last=0;
  const start=(x,y,multi)=>{if(multi){clearTimeout(pressT);p0=null;return;}const now=Date.now();if(p0&&now-last<50)return;last=now;p0=[x,y];clearTimeout(pressT);
    pressT=setTimeout(()=>{const r=mc.getBoundingClientRect();if(p0)openPress(map.containerPointToLatLng(L.point(p0[0]-r.left,p0[1]-r.top)));p0=null;},520);};
  const move=(x,y)=>{if(p0&&Math.hypot(x-p0[0],y-p0[1])>8){clearTimeout(pressT);p0=null;}};
  const end=()=>{clearTimeout(pressT);p0=null;};
  mc.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;start(e.clientX,e.clientY,e.isPrimary===false);},true);
  mc.addEventListener('touchstart',e=>start(e.touches[0].clientX,e.touches[0].clientY,e.touches.length>1),{capture:true,passive:true});
  mc.addEventListener('mousedown',e=>{if(e.button===0)start(e.clientX,e.clientY,false);},true);
  mc.addEventListener('pointermove',e=>move(e.clientX,e.clientY),true);
  mc.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY),{capture:true,passive:true});
  mc.addEventListener('mousemove',e=>move(e.clientX,e.clientY),true);
  ['pointerup','pointercancel','touchend','touchcancel','mouseup'].forEach(t=>mc.addEventListener(t,end,true));
  map.on('contextmenu',e=>{if(Date.now()-pressAt>800)openPress(e.latlng);});
  map.on('movestart zoomstart',()=>{clearTimeout(pressT);p0=null;closePress();});})();
$('locate').onclick=()=>{if(!navigator.geolocation){toast('這個瀏覽器不支援定位');return;}
  navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude,k=cellAtLatLng(la,lo);meLayer.clearLayers();
    if(k<0){toast('你目前的位置不在臺北市範圍內');return;}
    L.marker([la,lo],{icon:L.divIcon({className:'me',iconSize:[18,18]}),interactive:false}).addTo(meLayer);
    if(state.res&&!isNaN(state.res.worst[k]))openCell(k,{title:'我的位置',sub:DISTRICTS[CELLS[k].d].name+'・從這裡走到最近的每一類設施'});else map.setView([la,lo],16);},
   ()=>toast('無法取得位置，請確認已允許定位'),{enableHighAccuracy:true,timeout:8000});};

// ---------- main flow ----------
async function run(){const seq=++state.seq;state.err=null;drawLifeCenters();
  if((!state.baked&&state.scope==='')||!state.active.size){state.res=null;state.zones=[];drawHeat();drawPins();drawFacilities();render();return;}
  if(!state.baked){const need=[...new Set([...state.active,'mrt'])];
    if(need.some(id=>!data(id))){state.res=null;drawHeat();drawPins();render();busy(true);
      try{await ensureLive(need);}catch(e){busy(false);if(seq===state.seq){state.err=e;render();toast('下載失敗：'+e.message,true);}return;}
      busy(false);if(seq!==state.seq)return;}}
  analyze();drawHeat();drawPins();drawFacilities();render();}
(async()=>{fillScope();renderCategorySettings();setSheet('peek',false);render();drawScope(true);busy(true);
  await loadBaked();busy(false);state.loading=false;run();})();
</script>
</body>
